name: Build and Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            goos: linux
            goarch: amd64
            ext: so
            package_cmd: tar -czvf
            pkg_ext: tar.gz
          - os: ubuntu-latest
            target: linux-arm64
            goos: linux
            goarch: arm64
            ext: so
            package_cmd: tar -czvf
            pkg_ext: tar.gz
            cross_cc: aarch64-linux-gnu-gcc
          - os: windows-latest
            target: windows-amd64
            goos: windows
            goarch: amd64
            ext: dll
            package_cmd: 7z a
            pkg_ext: zip
          - os: macos-latest
            target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: dylib
            package_cmd: tar -czvf
            pkg_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Install ARM64 Cross Compiler (Linux ARM64)
        if: matrix.target == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build Dynamic Library
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cross_cc || 'gcc' }}
        shell: bash
        run: |
          mkdir -p dist
          go build -buildmode=c-shared -ldflags="-s -w" -o dist/cpa-quota-credit.${{ matrix.ext }} main.go

      - name: Package Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $archiveName = "cpa-quota-credit-${{ matrix.target }}.zip"
          Compress-Archive -Path dist/cpa-quota-credit.dll, README.md, config.example.yaml, cpa-quota-credit.user.js -DestinationPath $archiveName

      - name: Package Artifacts (Linux / macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          ARCHIVE_NAME="cpa-quota-credit-${{ matrix.target }}.${{ matrix.pkg_ext }}"
          cp README.md config.example.yaml dist/
          cp cpa-quota-credit.user.js dist/ 2>/dev/null || true
          cd dist
          tar -czvf "../${ARCHIVE_NAME}" *
          cd ..

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpa-quota-credit-${{ matrix.target }}
          path: cpa-quota-credit-${{ matrix.target }}.${{ matrix.pkg_ext }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Copy UserScript for Direct Install
        shell: bash
        run: |
          if [ -f "cpa-quota-credit.user.js" ]; then
            cp cpa-quota-credit.user.js release-assets/
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
